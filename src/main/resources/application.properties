spring.application.name=campus-trade-backend
campus.rabbit.enabled=${CAMPUS_RABBIT_ENABLED:false}
campus.search.enabled=${CAMPUS_SEARCH_ENABLED:false}
campus.search.url=${CAMPUS_SEARCH_URL:http://localhost:9200}
campus.search.api-key=${CAMPUS_SEARCH_API_KEY:}
campus.search.rebuild-on-startup=${CAMPUS_SEARCH_REBUILD:false}
campus.kafka.enabled=${CAMPUS_KAFKA_ENABLED:false}
campus.kafka.rebuild-on-startup=${CAMPUS_KAFKA_REBUILD:false}
spring.kafka.bootstrap-servers=${CAMPUS_KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.missing-topics-fatal=false
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
management.health.rabbit.enabled=${CAMPUS_RABBIT_ENABLED:false}
management.metrics.tags.application=campus-trade
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.campus.search.index.latency=true
management.metrics.distribution.percentiles-histogram.campus.kafka.consumer.end.to.end=true
spring.rabbitmq.host=${CAMPUS_RABBIT_HOST:localhost}
spring.rabbitmq.port=${CAMPUS_RABBIT_PORT:5672}
spring.rabbitmq.username=${CAMPUS_RABBIT_USER:guest}
spring.rabbitmq.password=${CAMPUS_RABBIT_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.profiles.default=local
campus.order.confirmation-hours=${CAMPUS_ORDER_CONFIRMATION_HOURS:24}
campus.order.expiry-scan-ms=${CAMPUS_ORDER_EXPIRY_SCAN_MS:60000}
campus.messaging.max-per-minute=${CAMPUS_MESSAGE_MAX_PER_MINUTE:20}
logging.pattern.level=%5p [requestId=%X{requestId:-}]
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=32MB
server.error.include-message=always

# AI 辅助发布默认关闭；未配置时不影响商品手动发布及交易主流程。
campus.ai.enabled=${CAMPUS_AI_ENABLED:false}
campus.ai.base-url=${CAMPUS_AI_BASE_URL:https://api.openai.com/v1}
campus.ai.api-key=${CAMPUS_AI_API_KEY:}
campus.ai.model=${CAMPUS_AI_MODEL:gpt-4o-mini}
campus.ai.connect-timeout=${CAMPUS_AI_CONNECT_TIMEOUT:3s}
campus.ai.request-timeout=${CAMPUS_AI_REQUEST_TIMEOUT:12s}
campus.ai.retry-delay=${CAMPUS_AI_RETRY_DELAY:200ms}
campus.ai.rate-limit-per-minute=${CAMPUS_AI_RATE_LIMIT_PER_MINUTE:5}
