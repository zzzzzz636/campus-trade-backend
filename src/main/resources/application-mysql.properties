spring.datasource.url=${CAMPUS_DB_URL:jdbc:mysql://127.0.0.1:3306/campus_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${CAMPUS_DB_USER:campus_trade}
spring.datasource.password=${CAMPUS_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.configuration.map-underscore-to-camel-case=true
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.validate-migration-naming=true
spring.flyway.validate-on-migrate=true
# 已有 V2 数据库没有 Flyway 历史表时，记录为版本 2；新空库仍从 V1 开始执行。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.data.redis.url=${CAMPUS_REDIS_URL:redis://127.0.0.1:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.mail.host=${CAMPUS_SMTP_HOST:}
spring.mail.port=${CAMPUS_SMTP_PORT:587}
spring.mail.username=${CAMPUS_SMTP_USER:}
spring.mail.password=${CAMPUS_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${CAMPUS_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${CAMPUS_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
campus.mail.from=${CAMPUS_SMTP_FROM:}
campus.storage.upload-dir=${CAMPUS_UPLOAD_DIR:./data/uploads}
