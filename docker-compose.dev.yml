services:
  app:
    profiles: ["app"]
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CAMPUS_DB_URL: jdbc:mysql://mysql:3306/${CAMPUS_MYSQL_DATABASE:-campus_trade}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      CAMPUS_DB_USER: ${CAMPUS_DB_USER:-campus_trade}
      CAMPUS_DB_PASSWORD: ${CAMPUS_DB_PASSWORD}
      CAMPUS_JWT_SECRET: ${CAMPUS_JWT_SECRET}
      CAMPUS_REDIS_URL: redis://redis:6379
      CAMPUS_RABBIT_ENABLED: "true"
      CAMPUS_RABBIT_HOST: rabbit
      CAMPUS_RABBIT_USER: ${CAMPUS_RABBIT_USER:-campus_trade}
      CAMPUS_RABBIT_PASSWORD: ${CAMPUS_RABBIT_PASSWORD}
      CAMPUS_SEARCH_ENABLED: ${CAMPUS_SEARCH_ENABLED:-false}
      CAMPUS_SEARCH_URL: http://elasticsearch:9200
      CAMPUS_SEARCH_API_KEY: ${CAMPUS_SEARCH_API_KEY:-}
      CAMPUS_SEARCH_REBUILD: ${CAMPUS_SEARCH_REBUILD:-false}
      CAMPUS_KAFKA_ENABLED: ${CAMPUS_KAFKA_ENABLED:-false}
      CAMPUS_KAFKA_BOOTSTRAP: kafka:9092
      CAMPUS_KAFKA_REBUILD: ${CAMPUS_KAFKA_REBUILD:-false}
      CAMPUS_SMTP_HOST: mailpit
      CAMPUS_SMTP_PORT: "1025"
      CAMPUS_SMTP_AUTH: "false"
      CAMPUS_SMTP_STARTTLS: "false"
      CAMPUS_SMTP_FROM: noreply@campustrade.local
      CAMPUS_AI_ENABLED: ${CAMPUS_AI_ENABLED:-false}
      CAMPUS_AI_API_KEY: ${CAMPUS_AI_API_KEY:-}
    volumes:
      - campus-trade-upload-data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      rabbit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:${CAMPUS_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${CAMPUS_MYSQL_DATABASE:-campus_trade}
      MYSQL_USER: ${CAMPUS_DB_USER:-campus_trade}
      MYSQL_PASSWORD: ${CAMPUS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CAMPUS_DB_ROOT_PASSWORD}
    volumes:
      - campus-trade-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - campus-trade-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbit:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${CAMPUS_RABBIT_USER:-campus_trade}
      RABBITMQ_DEFAULT_PASS: ${CAMPUS_RABBIT_PASSWORD}
    volumes:
      - campus-trade-rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - campus-trade-mailpit-data:/data

  elasticsearch:
    profiles: ["search"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.10
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - campus-trade-search-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka:
    profiles: ["analytics"]
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9094:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_RETENTION_HOURS: "72"
    volumes:
      - campus-trade-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  prometheus:
    profiles: ["monitor"]
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - campus-trade-prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  grafana:
    profiles: ["monitor"]
    image: grafana/grafana:11.6.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${CAMPUS_GRAFANA_ADMIN_PASSWORD:-}
      CAMPUS_GRAFANA_ADMIN_PASSWORD: ${CAMPUS_GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    entrypoint: ["/bin/sh", "-ec", "test -n \"$$CAMPUS_GRAFANA_ADMIN_PASSWORD\"; exec /run.sh"]
    volumes:
      - campus-trade-grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy

  nginx:
    profiles: ["edge"]
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  campus-trade-mysql-data:
  campus-trade-redis-data:
  campus-trade-rabbit-data:
  campus-trade-mailpit-data:
  campus-trade-upload-data:
  campus-trade-search-data:
  campus-trade-kafka-data:
  campus-trade-prometheus-data:
  campus-trade-grafana-data:
