services:
  app:
    profiles: ["app"]
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CAMPUS_DB_URL: jdbc:mysql://mysql:3306/${CAMPUS_MYSQL_DATABASE:-campus_trade}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      CAMPUS_DB_USER: ${CAMPUS_DB_USER:-campus_trade}
      CAMPUS_DB_PASSWORD: ${CAMPUS_DB_PASSWORD}
      CAMPUS_JWT_SECRET: ${CAMPUS_JWT_SECRET}
      CAMPUS_REDIS_URL: redis://redis:6379
      CAMPUS_SMTP_HOST: mailpit
      CAMPUS_SMTP_PORT: "1025"
      CAMPUS_SMTP_AUTH: "false"
      CAMPUS_SMTP_STARTTLS: "false"
      CAMPUS_SMTP_FROM: noreply@campustrade.local
      CAMPUS_AI_ENABLED: ${CAMPUS_AI_ENABLED:-false}
      CAMPUS_AI_API_KEY: ${CAMPUS_AI_API_KEY:-}
    volumes:
      - campus-trade-upload-data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  mysql:
    image: mysql:8.4
    container_name: campus-trade-mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:${CAMPUS_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${CAMPUS_MYSQL_DATABASE:-campus_trade}
      MYSQL_USER: ${CAMPUS_DB_USER:-campus_trade}
      MYSQL_PASSWORD: ${CAMPUS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CAMPUS_DB_ROOT_PASSWORD}
    volumes:
      - campus-trade-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: campus-trade-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - campus-trade-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: campus-trade-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - campus-trade-mailpit-data:/data

volumes:
  campus-trade-mysql-data:
  campus-trade-redis-data:
  campus-trade-mailpit-data:
  campus-trade-upload-data:
