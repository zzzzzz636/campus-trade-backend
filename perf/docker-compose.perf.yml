services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campus_trade_perf
      MYSQL_USER: campus_perf
      MYSQL_PASSWORD: ${PERF_DB_PASSWORD:?set in target/perf.env}
      MYSQL_ROOT_PASSWORD: ${PERF_DB_ROOT_PASSWORD:?set in target/perf.env}
    ports:
      - "127.0.0.1:13307:3306"
    volumes:
      - perf-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.10
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - perf-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  perf-mysql-data:
  perf-es-data:
